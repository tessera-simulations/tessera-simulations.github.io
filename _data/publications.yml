- key: lovell2026a
  title: "Efficiently emulating distribution functions in gigaparsec volumes for varying cosmological parameters"
  authors: Lovell C. C., Lee M. E., Roper W. J., Anglés-Alcázar D., Genel S., Pandey S., Villaescusa-Navarro F.
  year: 2026
  journal: arXiv e-prints
  arxiv: "2604.17981"
  summary: >-
    Formalises composite zooms as an emulation problem. A neural network emulator for the halo
    mass function, trained on small regions of the Quijote Big Sobol Sequence, recovers the global
    mass function of the full box using 0.026 per cent of the simulated volume.
  kind: core
