---
layout: default
---
<header class="page-head">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
<div class="wrap">
  <article class="prose{% if page.wide %} prose-wide{% endif %}">
    {{ content }}
  </article>
</div>
