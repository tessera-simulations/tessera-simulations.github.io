---
layout: default
---
<header class="page-head">
  <div class="wrap">
    <p class="meta"><a href="{{ '/news/' | relative_url }}">News</a> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </div>
</header>
<div class="wrap"><article class="prose">
  {{ content }}
</article></div>
<nav class="wrap post-nav">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">Older: {{ page.previous.title }}</a>{% endif %}
  {% if page.next %}<a href="{{ page.next.url | relative_url }}">Newer: {{ page.next.title }}</a>{% endif %}
</nav>
